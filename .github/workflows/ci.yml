name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trello
          POSTGRES_USER: trello
          POSTGRES_PASSWORD: trello
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trello -d trello"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://trello:trello@localhost:5432/trello
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      BOT_FSM_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run backend/manage.py check
      - run: uv run backend/manage.py makemigrations --check --dry-run
      - run: uv run pytest
