name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: trello
          POSTGRES_USER: trello
          POSTGRES_PASSWORD: trello
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trello -d trello"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://trello:trello@localhost:5432/trello
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      BOT_FSM_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # gettext for the translations test; Pango and HarfBuzz for WeasyPrint's PDFs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run backend/manage.py check
      - run: uv run backend/manage.py makemigrations --check --dry-run
      - name: Dashboard permission list matches the backend
        if: hashFiles('dashboard/package.json') != ''
        run: uv run backend/manage.py perms_ts --check
      - name: Backend and employee bot tests
        run: uv run pytest backend employee_bot/tests
      - name: Owner bot tests
        run: uv run pytest owner_bot/ownerbot/tests

  miniapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The compose files and the Caddyfile parse, so a deploy never fails on a typo.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: >-
          DOMAIN=ci.example.com
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app config --quiet
      - run: >-
          docker run --rm -e DOMAIN=ci.example.com
          -v "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine
          caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate
