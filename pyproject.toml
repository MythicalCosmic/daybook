[project]
name = "trello911"
version = "0.1.0"
description = "Multi-tenant Telegram task and HR platform: Django backend and Telegram bots"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "celery[redis]>=5.6.3",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-unfold>=0.110.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "polib>=1.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-django>=4.11.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "ASYNC", "SIM", "RUF"]
ignore = [
    "RUF001",  # bot texts use emoji like ➕ on purpose
    "RUF012",  # mutable class attributes are idiomatic in Django Meta and ModelAdmin
]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings/*.py" = ["F403", "F405"]
"employee_bot/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "bot", "config", "core", "main", "utils"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend", "employee_bot"]
testpaths = ["backend", "employee_bot/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # django-unfold's own admin code; nothing to fix on our side.
    "ignore:Overriding get_action_choices",
]
