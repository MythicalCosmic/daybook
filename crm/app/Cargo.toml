[package]
name = "daybook-crm"
description = "Daybook CRM for pharmacies: Windows, macOS, Android, iPhone and web from one Rust codebase"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
crm = { package = "daybook-crm-core", path = "../core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "UrlSearchParams", "Document", "Element", "HtmlElement", "MediaQueryList", "Navigator"] }
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json", "cookies"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
