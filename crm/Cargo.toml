[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Daybook"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std", "wasmbind"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# The web release: wasm-bindgen needs the target_features section, so no stripping here.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = false
