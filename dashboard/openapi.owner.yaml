            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementsStats'
          description: ''
  /api/v1/owner/companies/{company_id}/attendance/board/:
    get:
      operationId: companies_attendance_board_retrieve
      description: Who is in, late, not here yet, absent or off on a day, per person
        and branch.
      parameters:
      - in: query
        name: branch
        schema:
          type: array
          items:
            type: integer
        description: Branch ids (within your scope).
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD, today by default.
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/v1/owner/companies/{company_id}/attendance/corrections/:
    get:
      operationId: companies_attendance_corrections_list
      description: '"I forgot to check in" requests.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - all
          - approved
          - pending
          - rejected
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCorrectionOutList'
          description: ''
  /api/v1/owner/companies/{company_id}/attendance/corrections/{id}/decide/:
