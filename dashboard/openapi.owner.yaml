      description: |-
        * `company` - Everyone in the company
        * `attendees` - Only the people invited
    AgendaEventWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          default: ''
          maxLength: 5000
        kind:
