          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    PatchedAttendanceSettingsRequest:
      type: object
      properties:
        require_location:
          type: boolean
          description: People share their location when they check in or out.
        require_photo:
          type: boolean
          description: People take a selfie when they check in.
        outside_action:
          allOf:
          - $ref: '#/components/schemas/AttendanceOutsideActionEnum'
          description: |-
            What happens when someone checks in outside the branch's geofence.

            * `flag` - Allow and mark it
            * `reject` - Refuse the check-in
        grace_minutes:
          type: integer
          maximum: 240
          minimum: 0
          description: Minutes after the shift starts that still count as on time.
        early_leave_grace_minutes:
          type: integer
          maximum: 240
          minimum: 0
          description: Minutes before the shift ends that still count as a full day.
        remind_after_minutes:
          type: integer
          maximum: 240
          minimum: 0
          description: Remind someone who hasn't checked in this long after start.
        no_show_alert_minutes:
          type: integer
          maximum: 480
          minimum: 0
          description: Tell managers when someone hasn't checked in by then.
        auto_close_after_hours:
          type: integer
          maximum: 24
          minimum: 1
          description: Close a forgotten check-out this many hours after the shift
            ends.
        max_accuracy_m:
          type: integer
          maximum: 5000
          minimum: 10
          description: Locations less precise than this are marked as low accuracy.
        tasks_follow_shifts:
          type: boolean
          description: No daily tasks on a rostered day off.
        swaps_need_approval:
          type: boolean
          description: A manager approves swaps and covers after the colleague agrees.
        open_shift_claim_needs_approval:
          type: boolean
          description: A manager approves who takes an open shift.
        pre_shift_reminder_minutes:
          type: integer
          maximum: 240
          minimum: 0
          description: 'Remind people this long before their shift. 0: no reminder.'
        early_check_in_minutes:
          type: integer
          maximum: 480
          minimum: 0
          description: How early a check-in still belongs to the coming shift.
        overtime_after_minutes:
          type: integer
          maximum: 240
          minimum: 0
          description: Extra time shorter than this isn't overtime.
