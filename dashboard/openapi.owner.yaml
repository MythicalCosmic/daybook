      - fee
      - from_account
      - id
      - occurred_on
      - source
      - to_account
    TransferCreateRequest:
      type: object
      properties:
        from_account:
          type: integer
        to_account:
          type: integer
        amount_out:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        amount_in:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
          nullable: true
        fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        occurred_on:
          type: string
          format: date
        description:
          type: string
          maxLength: 300
      required:
      - amount_out
      - from_account
      - occurred_on
      - to_account
    UnassignRequest:
      type: object
      properties:
        member_ids:
          type: array
          items:
            type: integer
          maxItems: 500
      required:
      - member_ids
    Updated:
      type: object
      properties:
        updated:
          type: integer
      required:
      - updated
    VerifyRequest:
      type: object
      properties:
        recount_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        note:
          type: string
          default: ''
          maxLength: 2000
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    WriteOffRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
      required:
      - reason
  securitySchemes:
    ownerJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
