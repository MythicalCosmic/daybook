components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
          description: Owner access token (aud=dashboard), 15 minutes.
      required:
      - access
    Account:
      type: object
      description: |-
        A money account with its balance, the balance in the base currency at today's rate and
        a 30-day sparkline (from `context["figures"]`).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/FinanceAccountKindEnum'
        kind_label:
          type: string
          readOnly: true
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        branch:
          allOf:
          - $ref: '#/components/schemas/FinanceBranchRef'
          nullable: true
          readOnly: true
        holder:
          allOf:
          - $ref: '#/components/schemas/FinanceRef'
          nullable: true
          readOnly: true
        operators:
          type: array
          items:
            $ref: '#/components/schemas/FinanceRef'
          readOnly: true
        bank_name:
          type: string
          maxLength: 100
        number_last4:
          description: Never the full number.
          oneOf:
          - type: string
            pattern: ^\d{4}$
            maxLength: 4
          - type: string
            maxLength: 0
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        base_balance:
          type: string
          nullable: true
          readOnly: true
        allow_negative:
          type: boolean
        is_active:
          type: boolean
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
        color:
          oneOf:
          - type: string
            pattern: ^#[0-9a-fA-F]{6}$
            maxLength: 7
          - type: string
            maxLength: 0
        spark:
          type: array
          items:
            type: string
          readOnly: true
        last_activity:
          type: string
          format: date
          nullable: true
          readOnly: true
        can_record:
          type: boolean
          readOnly: true
      required:
      - balance
      - base_balance
      - branch
      - can_record
      - holder
      - id
      - kind
      - kind_label
      - last_activity
      - name
      - operators
      - spark
    AccountWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: '#/components/schemas/FinanceAccountKindEnum'
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyCodeEnum'
          default: UZS
        branch:
          type: integer
          nullable: true
        holder:
          type: integer
          nullable: true
        operators:
          type: array
          items:
            type: integer
        bank_name:
          type: string
          maxLength: 100
        number_last4:
          type: string
          maxLength: 4
        allow_negative:
          type: boolean
        color:
          type: string
          maxLength: 7
        order:
          type: integer
          minimum: 0
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        opening_on:
          type: string
          format: date
          nullable: true
      required:
      - kind
      - name
    ActionRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    Actor:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: Their membership, when they have one.
        name:
          type: string
      required:
      - id
      - name
    AgendaAttendee:
      type: object
      properties:
        member:
          type: object
          additionalProperties: {}
          description: '{id, name, photo_url, position}'
          readOnly: true
        response:
          $ref: '#/components/schemas/AgendaAttendeeResponseEnum'
        responded_at:
          type: string
          format: date-time
          nullable: true
      required:
      - member
    AgendaAttendeeResponseEnum:
      enum:
      - pending
      - going
      - declined
      type: string
      description: |-
        * `pending` - Not answered
        * `going` - Going
        * `declined` - Can't come
    AgendaCalendar:
      type: object
      properties:
        range:
          type: object
          additionalProperties:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AgendaSource'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgendaCalendarItem'
      required:
      - items
      - range
      - sources
    AgendaCalendarItem:
      type: object
      description: |-
        One date on the calendar. `id` is unique across sources ("agenda.events:12-20261027");
        all-day items carry days (`end` inclusive), timed ones ISO instants. `color` is a design
        token name ("chart-3", "success") the client turns into a colour.
      properties:
        id:
          type: string
        source:
          type: string
        kind:
          type: string
        title:
          type: string
        start:
          type: string
        end:
          type: string
          nullable: true
        all_day:
          type: boolean
        color:
          type: string
        url:
          type: string
        subtitle:
          type: string
          description: Where a company event happens; empty otherwise.
      required:
      - all_day
      - color
      - end
      - id
      - kind
      - source
      - start
      - subtitle
      - title
      - url
    AgendaCancelRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 300
    AgendaEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        kind:
          $ref: '#/components/schemas/AgendaEventKindEnum'
        color:
          type: string
          readOnly: true
        start:
          type: string
          readOnly: true
        end:
          type: string
          nullable: true
          readOnly: true
        all_day:
          type: boolean
          description: All-day events use the company's calendar days.
        place:
          type: string
          maxLength: 200
        branch:
          type: object
          additionalProperties: {}
          nullable: true
          description: '{id, name}'
          readOnly: true
        visibility:
          $ref: '#/components/schemas/AgendaEventVisibilityEnum'
        remind_before:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: 'Minutes before the start the attendees get a reminder. Empty:
            none.'
        repeat:
          $ref: '#/components/schemas/AgendaEventRepeatEnum'
        repeat_until:
          type: string
          format: date
          nullable: true
          description: The last day it may repeat on (company calendar).
        created_by:
          allOf:
          - $ref: '#/components/schemas/AgendaPerson'
          nullable: true
          readOnly: true
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/AgendaAttendee'
          readOnly: true
        responses:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        my_response:
          type: string
          nullable: true
          readOnly: true
        cancelled:
          type: boolean
          readOnly: true
        cancel_reason:
          type: string
          maxLength: 300
        can_edit:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attendees
      - branch
      - can_edit
      - cancelled
      - color
      - created_at
      - created_by
      - end
      - id
      - my_response
      - responses
      - start
      - title
      - updated_at
    AgendaEventKindEnum:
      enum:
      - meeting
      - training
      - inventory
      - celebration
      - deadline
      - other
      type: string
      description: |-
        * `meeting` - Meeting
        * `training` - Training
        * `inventory` - Inventory
        * `celebration` - Celebration
        * `deadline` - Deadline
        * `other` - Other
    AgendaEventRepeatEnum:
      enum:
      - none
      - weekly
