        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerAnnouncement'
          description: ''
  /api/v1/owner/companies/{company_id}/announcements/{id}/receipts/:
