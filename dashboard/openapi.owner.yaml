        place:
          type: string
          default: ''
          maxLength: 200
        branch:
          type: integer
          nullable: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/AgendaEventVisibilityEnum'
          default: company
        attendee_ids:
          type: array
          items:
            type: integer
          maxItems: 300
        remind_before:
          type: integer
          maximum: 10080
          minimum: 0
          nullable: true
        repeat:
          allOf:
          - $ref: '#/components/schemas/AgendaEventRepeatEnum'
          default: none
        repeat_until:
          type: string
          format: date
          nullable: true
      required:
      - start
      - title
    AgendaPeople:
