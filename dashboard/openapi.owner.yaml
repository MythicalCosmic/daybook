  /api/v1/owner/companies/{company_id}/search/:
    get:
      operationId: companies_search_retrieve
      description: 'Command palette results: up to 5 per type from every provider
        you may use.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: q
        schema:
          type: string
        required: true
      - in: query
        name: types
        schema:
          type: string
        description: Comma-separated hit types.
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleSearchResults'
          description: ''
  /api/v1/owner/companies/{company_id}/stream/:
    get:
      operationId: companies_stream_retrieve
      description: The live activity stream, newest first.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: since
        schema:
          type: string
          format: date-time
        description: Only newer items.
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleStream'
          description: ''
  /api/v1/owner/me/:
    get:
      operationId: me_retrieve
      description: The signed-in person and every company where they may open the
        dashboard.
      tags:
      - me
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerMe'
          description: ''
    patch:
      operationId: me_partial_update
      description: The signed-in person and every company where they may open the
        dashboard.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOwnerMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOwnerMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOwnerMeUpdateRequest'
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerMe'
          description: ''
  /api/v1/owner/permissions/:
    get:
      operationId: permissions_list
      description: Every permission a role can grant, for the roles matrix.
      tags:
      - permissions
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
          description: ''
components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
          description: Owner access token (aud=dashboard), 15 minutes.
      required:
      - access
    ActionRequest:
      type: object
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
    Actor:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: Their membership, when they have one.
        name:
          type: string
      required:
      - id
      - name
    AuditRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          readOnly: true
        action_label:
          type: string
        actor:
          allOf:
          - $ref: '#/components/schemas/Actor'
          nullable: true
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: integer
          readOnly: true
          nullable: true
        target:
          type: string
          readOnly: true
          description: Its name at the time.
        details:
          description: Secret values are always shown as •••.
      required:
      - action
      - action_label
      - actor
      - created_at
      - details
      - id
      - target
      - target_id
      - target_type
    BranchBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
      required:
      - code
      - id
      - name
    BranchToday:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        opens_at:
          type: string
          nullable: true
          description: HH:MM, company time.
        closes_at:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ConsoleBranchStatusEnum'
        sales:
          type: object
          additionalProperties: {}
          description: contracts.SalesFacts
        attendance:
          type: object
          additionalProperties: {}
          description: contracts.AttendanceFacts
        tasks:
          type: object
          additionalProperties: {}
          description: contracts.TasksFacts
        finance:
          type: object
          additionalProperties: {}
          description: contracts.FinanceFacts
      required:
      - closes_at
      - code
      - id
      - name
      - opens_at
      - status
    Column:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        kind:
          $ref: '#/components/schemas/ExportsColumnKindEnum'
      required:
      - key
      - kind
      - label
    ConsoleActionMethodEnum:
      enum:
      - POST
      - PATCH
      - PUT
      - DELETE
      type: string
      description: |-
        * `POST` - POST
        * `PATCH` - PATCH
        * `PUT` - PUT
