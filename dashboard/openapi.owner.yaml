          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionOut'
          description: ''
  /api/v1/owner/companies/{company_id}/attendance/members/{member_id}/:
    get:
      operationId: companies_attendance_members_retrieve
      description: 'One person''s month (Person 360 tab): coded days, totals, schedule,
        recent records.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      - in: query
        name: month
        schema:
          type: string
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMonth'
          description: ''
  /api/v1/owner/companies/{company_id}/attendance/records/:
    get:
      operationId: companies_attendance_records_list
      description: |-
        Check-in records: list with filters, detail, manual records, corrections, excuses
        and overtime decisions.
      parameters:
      - in: query
        name: branch
        schema:
          type: array
          items:
            type: integer
        description: Branch ids (within your scope).
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: flag
        schema:
          type: string
          enum:
          - auto_closed
          - edited
          - low_accuracy
          - no_location
          - outside_geofence
          - unscheduled
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: member
        schema:
          type: integer
      - in: query
        name: overtime
        schema:
          type: string
          enum:
          - approved
          - none
          - pending
          - rejected
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - absent
          - auto_closed
          - closed
          - excused
          - open
      - in: query
        name: to
        schema:
          type: string
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecordRowList'
          description: ''
    post:
      operationId: companies_attendance_records_create
      description: |-
        Check-in records: list with filters, detail, manual records, corrections, excuses
        and overtime decisions.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '201':
          content:
            application/json:
