openapi: 3.0.3
info:
  title: 911 Trello API
  version: 0.1.0
  description: API for the employee mini app and the owner dashboard.
paths:
  /api/v1/owner/auth/dev-login/:
    post:
      operationId: auth_dev_login_create
      description: 'Development only (`DEBUG` and `DASHBOARD_DEV_LOGIN`): sign in
        as a Telegram id.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
  /api/v1/owner/auth/login-links/:
    post:
      operationId: auth_login_links_create
      description: 'Start a desktop sign-in: show `deep_link` as a QR and `match_code`
        in large type.'
      tags:
      - auth
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLink'
          description: ''
        '503':
          description: Telegram sign-in isn't set up.
  /api/v1/owner/auth/login-links/{link_id}/:
    get:
      operationId: auth_login_links_retrieve
      description: Where a sign-in stands. Never changes anything and never returns
        a token.
      parameters:
      - in: header
        name: X-Login-Poll
        schema:
          type: string
        required: true
      - in: path
        name: link_id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLinkStatus'
          description: ''
        '404':
          description: No response body
  /api/v1/owner/auth/login-links/{link_id}/claim/:
    post:
      operationId: auth_login_links_claim_create
      description: Collect the session of an approved sign-in, once.
      parameters:
      - in: header
        name: X-Login-Poll
        schema:
          type: string
        required: true
      - in: path
        name: link_id
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '403':
          description: No dashboard access.
        '404':
          description: Unknown link or wrong poll token.
        '409':
          description: Not approved, expired or already used.
  /api/v1/owner/auth/logout/:
    post:
      operationId: auth_logout_create
      description: End this browser's session and clear the refresh cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/owner/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Needs the `owner_refresh` cookie, `X-Requested-With: dashboard`
        and a same-origin `Origin`. A refresh token used twice ends its session.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          description: Sign in again.
  /api/v1/owner/auth/sessions/:
    get:
      operationId: auth_sessions_list
      description: Browsers signed in to the dashboard as you (inside Telegram there
        is no session).
      tags:
      - auth
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSession'
          description: ''
  /api/v1/owner/auth/sessions/{session_id}/revoke/:
    post:
      operationId: auth_sessions_revoke_create
      description: |-
        Sign one browser out: its refresh stops working at once, its access token within 15
        minutes. Revoking this browser's own session also clears its cookie.
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoked'
          description: ''
        '404':
          description: No response body
  /api/v1/owner/auth/sessions/revoke-all/:
    post:
      operationId: auth_sessions_revoke_all_create
      description: Log out everywhere (every session, every outstanding token), or
        every other device.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAllRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeAllRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RevokeAllRequest'
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revoked'
          description: ''
  /api/v1/owner/auth/telegram/:
    post:
      operationId: auth_telegram_create
      description: |-
        Sign in with `Telegram.WebApp.initData` (owner bot, else employee bot), at most
        `OWNER_INIT_DATA_MAX_AGE` old. Answers an access token only; post the same initData again
        when it runs out.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          description: Invalid or old initData.
        '403':
          description: No dashboard access.
  /api/v1/owner/companies/:
    post:
      operationId: companies_create
      description: |-
        Create a company you own (the same path as `/new` in the owner bot), then open its
        "Get started".
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NewCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewCompanyRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedCompany'
          description: ''
        '400':
          description: Not allowed, bad code or bad input.
  /api/v1/owner/companies/{company_id}/announcements/:
    get:
      operationId: companies_announcements_list
      description: Announcements with their read rates, the composer and the follow-up
        actions.
      parameters:
      - in: query
        name: author
        schema:
          type: integer
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pinned
        schema:
          type: boolean
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOwnerAnnouncementList'
          description: ''
    post:
      operationId: companies_announcements_create
      description: Announcements with their read rates, the composer and the follow-up
        actions.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementsPublishRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnouncementsPublishRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementsPublishRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerAnnouncement'
          description: ''
  /api/v1/owner/companies/{company_id}/announcements/{id}/:
    get:
      operationId: companies_announcements_retrieve
      description: Announcements with their read rates, the composer and the follow-up
        actions.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerAnnouncement'
          description: ''
    patch:
      operationId: companies_announcements_partial_update
      description: Announcements with their read rates, the composer and the follow-up
        actions.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementsUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementsUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementsUpdateRequest'
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerAnnouncement'
          description: ''
  /api/v1/owner/companies/{company_id}/announcements/{id}/cancel/:
    post:
