openapi: 3.0.3
info:
  title: 911 Trello API
  version: 0.1.0
  description: API for the employee mini app and the owner dashboard.
paths:
  /api/v1/owner/auth/dev-login/:
    post:
      operationId: auth_dev_login_create
      description: 'Development only (`DEBUG` and `DASHBOARD_DEV_LOGIN`): sign in
        as a Telegram id.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
  /api/v1/owner/auth/logout/:
    post:
      operationId: auth_logout_create
      description: End this browser's session and clear the refresh cookie.
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/owner/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Needs the `owner_refresh` cookie, `X-Requested-With: dashboard`
        and a same-origin `Origin`. A refresh token used twice ends its session.'
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          description: Sign in again.
  /api/v1/owner/companies/{company_id}/audit/records/:
    get:
      operationId: companies_audit_records_list
      description: |-
        The History tab of one record: its audit rows the caller may see, newest first.

        Needs audit.view, or the permission the record's app registered for its history (for
        example tasks.view_all for a task). Rows touching salaries or IDs are left out unless the
        caller holds the permission they need.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: integer
        required: true
      - in: query
        name: target_type
        schema:
          type: string
        description: e.g. task, membership
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditRecordList'
          description: ''
  /api/v1/owner/companies/{company_id}/branches/today/:
    get:
      operationId: companies_branches_today_list
      description: 'Branch cards: status plus the facts of every module you may see.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchToday'
          description: ''
  /api/v1/owner/companies/{company_id}/exports/:
    get:
      operationId: companies_exports_list
      description: |-
        Your exports in this company (kept 7 days). Creating one needs `data.export` and the
        exporter's own permission; the file is built in the background (poll the detail).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExportList'
          description: ''
    post:
      operationId: companies_exports_create
      description: |-
        Your exports in this company (kept 7 days). Creating one needs `data.export` and the
        exporter's own permission; the file is built in the background (poll the detail).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportRequestRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportCreated'
          description: ''
  /api/v1/owner/companies/{company_id}/exports/{id}/:
    get:
      operationId: companies_exports_retrieve
      description: |-
        Your exports in this company (kept 7 days). Creating one needs `data.export` and the
        exporter's own permission; the file is built in the background (poll the detail).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
  /api/v1/owner/companies/{company_id}/exports/kinds/:
    get:
      operationId: companies_exports_kinds_list
      description: What you may export here.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExporterList'
          description: ''
  /api/v1/owner/companies/{company_id}/inbox/:
    get:
      operationId: companies_inbox_list
      description: Your in-app notifications in this company.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: tab
        schema:
          type: string
          enum:
          - all
          - unread
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/owner/companies/{company_id}/inbox/{id}/actions/{key}/:
    post:
      operationId: companies_inbox_actions_create
      description: |-
        Press a notification's button: the module's handler decides (and checks its own
        permission).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: key
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxActionResult'
          description: ''
  /api/v1/owner/companies/{company_id}/inbox/{id}/archive/:
    post:
      operationId: companies_inbox_archive_create
      description: Your in-app notifications in this company.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/owner/companies/{company_id}/inbox/read/:
    post:
      operationId: companies_inbox_read_create
      description: Your in-app notifications in this company.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Updated'
          description: ''
  /api/v1/owner/companies/{company_id}/inbox/unread-count/:
    get:
      operationId: companies_inbox_unread_count_retrieve
      description: Your in-app notifications in this company.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
          description: ''
  /api/v1/owner/companies/{company_id}/notification-preferences/:
    get:
      operationId: companies_notification_preferences_list
      description: 'Per kind: show in the dashboard and/or send to Telegram.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preference'
          description: ''
    put:
      operationId: companies_notification_preferences_update
      description: 'Per kind: show in the dashboard and/or send to Telegram.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreferenceRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreferenceRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreferenceRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preference'
          description: ''
  /api/v1/owner/companies/{company_id}/pulse/:
    get:
      operationId: companies_pulse_retrieve
      description: Badge counters and version keys; poll every 15 s and refetch what
        moved.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pulse'
          description: ''
  /api/v1/owner/companies/{company_id}/queue/:
    get:
      operationId: companies_queue_retrieve
      description: 'Needs you: approvals from every module, with the buttons that
        settle them.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
        description: Per kind, at most 200.
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleQueue'
          description: ''
  /api/v1/owner/companies/{company_id}/queue/counts/:
    get:
      operationId: companies_queue_counts_retrieve
      description: How many items wait, per kind.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleQueueCounts'
          description: ''
  /api/v1/owner/companies/{company_id}/saved-views/:
    get:
      operationId: companies_saved_views_list
      description: |-
        Your saved views and the ones colleagues shared (`?module=` narrows them). Only your
        own can be changed or deleted.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: module
        schema:
          type: string
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedView'
          description: ''
    post:
      operationId: companies_saved_views_create
      description: |-
        Your saved views and the ones colleagues shared (`?module=` narrows them). Only your
        own can be changed or deleted.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedViewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedViewRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
          description: ''
  /api/v1/owner/companies/{company_id}/saved-views/{id}/:
    get:
      operationId: companies_saved_views_retrieve
      description: |-
        Your saved views and the ones colleagues shared (`?module=` narrows them). Only your
        own can be changed or deleted.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved view.
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
          description: ''
    put:
      operationId: companies_saved_views_update
      description: |-
        Your saved views and the ones colleagues shared (`?module=` narrows them). Only your
        own can be changed or deleted.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved view.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedViewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedViewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedViewRequest'
        required: true
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
          description: ''
    patch:
      operationId: companies_saved_views_partial_update
      description: |-
        Your saved views and the ones colleagues shared (`?module=` narrows them). Only your
        own can be changed or deleted.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved view.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSavedViewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSavedViewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSavedViewRequest'
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedView'
          description: ''
    delete:
      operationId: companies_saved_views_destroy
      description: |-
        Your saved views and the ones colleagues shared (`?module=` narrows them). Only your
        own can be changed or deleted.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this saved view.
        required: true
      tags:
      - companies
      security:
      - ownerJwtAuth: []
