        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordRow'
          description: ''
  /api/v1/owner/companies/{company_id}/attendance/records/{id}/excuse/:
    post:
      operationId: companies_attendance_records_excuse_create
      description: |-
        Check-in records: list with filters, detail, manual records, corrections, excuses
        and overtime decisions.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - companies
