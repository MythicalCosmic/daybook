        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
        description: read or unread
      tags:
      - companies
      security:
      - ownerJwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementsReceiptList'
          description: ''
  /api/v1/owner/companies/{company_id}/announcements/{id}/remind/:
    post:
      operationId: companies_announcements_remind_create
      description: Announcements with their read rates, the composer and the follow-up
        actions.
      parameters:
      - in: path
        name: company_id
        schema:
