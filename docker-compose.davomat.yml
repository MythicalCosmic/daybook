# Davomat: Face ID attendance as an app of its own (EDITION=davomat), one organization per server.
# A standalone file, not an override of docker-compose.yml. deploy/davomat/install.sh writes .env
# and starts it (docs/davomat/en/INSTALL.md); by hand, from the checkout's root:
#   docker compose -f docker-compose.davomat.yml up -d --build
#   docker compose -f docker-compose.davomat.yml logs -f backend
# The scripts in deploy/davomat accept DAVOMAT_PROJECT and DAVOMAT_ENV_FILE to run a second copy
# (deploy/davomat/smoke.sh does, as project davomat-smoke).

name: davomat

x-env: &env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  EDITION: davomat
  DATABASE_URL: postgres://davomat:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/davomat
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  BOT_FSM_REDIS_URL: redis://redis:6379/2

# Container logs rotate: gunicorn writes a line per request (terminals post every scan and a
# heartbeat), and Docker keeps them forever otherwise.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-app: &app
  build: .
  image: ${DAVOMAT_IMAGE:-davomat:latest}
  env_file: ${DAVOMAT_ENV_FILE:-.env}
  environment: *env
  # A tiny init as PID 1: signals reach the app, finished child processes are reaped.
  init: true
  # Every service sees both upload folders: public logos and employee photos, and the private
  # files (scan snapshots, exports) that only signed links serve.
  volumes:
    - media:/app/backend/media
    - private_media:/app/backend/private_media
  logging: *logging
  restart: unless-stopped

# The workers and the bot start once the backend is healthy, which means the database is migrated:
# on a first start nothing runs against tables that don't exist yet.
x-after-backend: &after-backend
  backend:
    condition: service_healthy

services:
  caddy:
    image: caddy:2.11-alpine
    # Caddy gets only what the Caddyfile reads, none of the app's secrets.
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      CADDY_OPTIONS: ${CADDY_OPTIONS:-}
    # LISTEN_PREFIX empty: every address of the server (IPv4 and IPv6); "127.0.0.1:" this
    # computer only.
    ports:
      - "${LISTEN_PREFIX:-}${HTTP_PORT:-80}:80"
      - "${LISTEN_PREFIX:-}${HTTPS_PORT:-443}:443"
      - "${LISTEN_PREFIX:-}${HTTPS_PORT:-443}:443/udp"
    # Public uploads only. Private files never reach Caddy: Django serves them behind signed links.
    # CADDYFILE=Caddyfile.http serves everything over plain HTTP (a trial on localhost).
    volumes:
      - ./deploy/davomat/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: *after-backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  # Sized for the smallest server Davomat supports (2 vCPU, 4 GB): gunicorn's 3 × 4 threads keep 12
  # connections, the worker a few, the bot up to BOT_DB_THREADS, beat one; 100 leaves room for an
  # update, when old and new containers overlap. JIT compilation is off: it only ever added time to
  # this app's short queries.
  db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    environment:
      POSTGRES_DB: davomat
      POSTGRES_USER: davomat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Parallel queries share memory through /dev/shm; Docker's 64 MB default is too small.
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davomat -d davomat"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  # The cache, Celery's queue, the bot's conversations and the bot token's version (the bot
  # restarts when it changes).
  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    restart: unless-stopped

  # Django with gunicorn: the dashboard at /dashboard/, the API, the admin, the terminals' events.
  # Migrations run first; a first start on a small server takes a few minutes (start_period).
  # Defaults every module needs are filled in for the organization (idempotent); if that fails
  # it is logged and retried on the next start, but never keeps the site down.
  backend:
    <<: *app
    environment:
      <<: *env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    command: >-
      sh -c "python manage.py migrate --noinput
      && { python manage.py ensure_company_defaults || echo 'Company defaults failed (see the log above); starting anyway.' >&2; }
      && exec gunicorn -c config/gunicorn.conf.py config.wsgi"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The check asks with the site's own name (Django refuses any host that isn't in
    # DJANGO_ALLOWED_HOSTS) and says HTTPS, as Caddy does, so no redirect answers it.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ.get("DJANGO_ALLOWED_HOSTS", "").split(",")[0].strip().lstrip(".")
          headers = {"Host": host.strip("*") or "localhost", "X-Forwarded-Proto": "https"}
          request = urllib.request.Request("http://127.0.0.1:8000/health/", headers=headers)
          urllib.request.urlopen(request, timeout=4)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 900s

  # One Celery worker for every queue (notifications, exports, reports, media; AI is off in this
  # edition), one job per process at a time so a long export never holds messages back.
  worker:
    <<: *app
    command: >-
      sh -c "exec celery -A config worker -Q celery,default,ai,media -l info
      --concurrency $${CELERY_CONCURRENCY:-2} --prefetch-multiplier $${CELERY_PREFETCH:-1}
      --max-tasks-per-child $${CELERY_MAX_TASKS_PER_CHILD:-1000}"
    depends_on: *after-backend
    stop_grace_period: 30s

  # The schedule: the daily summary, lateness checks, snapshot clean-up and the other daily jobs.
  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on: *after-backend

  # The organization's Telegram bot (davomat_bot): its token comes from Settings › Telegram. With
  # no token it waits; when the token changes it exits and Docker starts it again with the new one.
  bot:
    <<: *app
    environment:
      <<: *env
      BOT_DB_THREADS: ${BOT_DB_THREADS:-8}
    working_dir: /app
    command: python -m davomat_bot
    depends_on: *after-backend
    stop_grace_period: 20s

  # Every night at BACKUP_TIME (in BACKUP_TZ): the database, the photos and the private files into
  # backups/<date>_<time>-nightly/, keeping BACKUP_KEEP_DAYS days (deploy/davomat/backup-run.sh).
  # deploy/davomat/backup.sh takes one at any time, restore.sh puts one back.
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: davomat
      PGDATABASE: davomat
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${BACKUP_TZ:-Asia/Tashkent}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${DAVOMAT_BACKUP_DIR:-./backups}:/backups
      - media:/media:ro
      - private_media:/private_media:ro
      - ./deploy/davomat:/davomat:ro
    entrypoint: ["/bin/sh", "/davomat/backup-run.sh", "--daily"]
    init: true
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  private_media:
  caddy_data:
  caddy_config:
