name: daybook-status

services:
  # A unique name: on vps8's shared network `edge` the service name is also a DNS name.
  daybook-status:
    build: .
    image: daybook-status:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - status-data:/data
      - ./config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:18095:8080"
    networks:
      - status
      # vps8's shared Caddy network: its site file (caddy-site.caddy) proxies to daybook-status:8080.
      - edge
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

networks:
  status:
    name: daybook-status
  edge:
    name: edge
    external: true

volumes:
  status-data:
    name: daybook-status-data
