# Production, on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# See docs/DEPLOY.md.

services:
  caddy:
    image: caddy:2.11-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  backend:
    # Only Caddy talks to it.
    ports: !reset []

  # A compressed database dump every night, keeping the last 14 days in ./backups.
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: trello
      PGDATABASE: trello
      PGPASSWORD: ${POSTGRES_PASSWORD:-trello}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump --no-owner | gzip > /backups/trello-$$(date +%F).sql.gz
          find /backups -name 'trello-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

volumes:
  caddy_data:
  caddy_config:
