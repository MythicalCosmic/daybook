# Production, on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# See docs/DEPLOY.md.

services:
  caddy:
    image: caddy:2.11-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    # Public uploads only. Private files never reach Caddy: Django serves them behind signed links.
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    # Not on stream: without it the site still works and the dashboard polls for AI answers.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  # Postgres' default connection limit (100) is plenty for one stack; the higher limit in
  # docker-compose.yml is for development.
  db:
    command: !reset []

  # Only Caddy talks to these.
  backend:
    ports: !reset []

  stream:
    ports: !reset []

  # Every night: a compressed database dump and an archive of the private files (receipts,
  # documents, contracts, payslips), keeping the last 14 days of each in ./backups.
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: trello
      PGDATABASE: trello
      PGPASSWORD: ${POSTGRES_PASSWORD:-trello}
    volumes:
      - ./backups:/backups
      - private_media:/private_media:ro
    entrypoint:
      - sh
      - -c
      - |
        # Only root on the server may read them: they hold contracts, ID scans and salaries.
        umask 077
        while true; do
          pg_dump --no-owner | gzip > /backups/trello-$$(date +%F).sql.gz
          tar czf /backups/private-media-$$(date +%F).tgz -C /private_media .
          find /backups \( -name 'trello-*.sql.gz' -o -name 'private-media-*.tgz' \) -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

volumes:
  caddy_data:
  caddy_config:
