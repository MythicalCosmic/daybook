# Production, on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# See docs/DEPLOY.md.

services:
  caddy:
    image: caddy:2.11-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    # Public uploads only. Private files never reach Caddy: Django serves them behind signed links.
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    # Not on stream: without it the site still works and the dashboard polls for AI answers.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  # Sized for the production server (12 vCPU, 47 GB, shared with the app): gunicorn's
  # 12 × 4 threads keep 48 connections, the workers 12, the bots up to 16 each, the stream and
  # beat a few; 200 leaves room for a deploy, when old and new containers overlap. JIT
  # compilation is off: it only ever added time to this app's short queries.
  db:
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-16GB}
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
    # Parallel queries share memory through /dev/shm; Docker's 64 MB default is too small.
    shm_size: 512mb

  # Only Caddy talks to these.
  backend:
    ports: !reset []

  stream:
    ports: !reset []

  # Speech to text for voice tasks (deploy/stt): Whisper on the CPU behind an OpenAI-compatible
  # endpoint that only the app's containers reach, at AI_SPEECH_URL=http://stt:8000/v1. The models
  # download into their volume on the first start (~4.5 GB, a few minutes); until then /health
  # says "loading" and voice messages are retried for a while before "try again later".
  stt:
    build: ./deploy/stt
    image: trello911-stt:latest
    # Stock Whisper writes Uzbek poorly, so Uzbek speech goes to rubaiSTT v2 (Whisper medium
    # fine-tuned on ~475 h of Uzbek, Tashkent dialect included; Apache-2.0), pinned to a commit.
    environment:
      STT_MODEL: ${STT_MODEL:-large-v3}
      STT_MODELS_BY_LANGUAGE: ${STT_MODELS_BY_LANGUAGE:-uz=AlexAnoshka/fast-whisper-uz-rubaistt-v2-medium-ct2@a38c89604615d6c3fc6f10692375ecbf89502bdb}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-6}
      STT_BEAM_SIZE: ${STT_BEAM_SIZE:-1}
    volumes:
      - stt_models:/models
    # Both models together hold about 5 GB once loaded.
    mem_limit: 10g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    restart: unless-stopped
    profiles: ["app"]

  # Every night: a compressed database dump and an archive of the private files (receipts,
  # documents, contracts, payslips), keeping the last 14 days of each in ./backups.
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: trello
      PGDATABASE: trello
      PGPASSWORD: ${POSTGRES_PASSWORD:-trello}
    volumes:
      - ./backups:/backups
      - private_media:/private_media:ro
    entrypoint:
      - sh
      - -c
      - |
        # Only root on the server may read them: they hold contracts, ID scans and salaries.
        umask 077
        while true; do
          pg_dump --no-owner | gzip > /backups/trello-$$(date +%F).sql.gz
          tar czf /backups/private-media-$$(date +%F).tgz -C /private_media .
          find /backups \( -name 'trello-*.sql.gz' -o -name 'private-media-*.tgz' \) -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

volumes:
  caddy_data:
  caddy_config:
  stt_models:
