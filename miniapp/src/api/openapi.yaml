openapi: 3.0.3
info:
  title: 911 Trello API
  version: 0.6.2
  description: API for the employee mini app and the owner dashboard.
paths:
  /api/v1/auth/telegram/:
    post:
      operationId: v1_auth_telegram_create
      description: |-
        Exchange the mini app's Telegram init data for an access token.

        Only an access token: the mini app signs in again with fresh init data when it expires,
        so no refresh token (and no blacklist row) is made every time the app opens.

        Limited per Telegram user once the signature checks out; per address only by a ceiling
        that a whole shift behind one mobile operator's NAT address never reaches.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/companies/{company_id}/activity/:
    get:
      operationId: v1_companies_activity_list
      description: The signed-in member's feed, newest first.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
