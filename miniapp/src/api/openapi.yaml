components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
          description: Bearer token for the API. When it expires, sign in with initData
            again.
      required:
      - access
    ActionsEnum:
      enum:
      - start
      - complete
      - confirm
      - return
      - edit
      - cancel
      type: string
      description: |-
        * `start` - start
        * `complete` - complete
        * `confirm` - confirm
        * `return` - return
        * `edit` - edit
        * `cancel` - cancel
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ActivityKindEnum'
          readOnly: true
        task:
          $ref: '#/components/schemas/TaskBrief'
        actor:
          allOf:
          - $ref: '#/components/schemas/MemberBrief'
          nullable: true
        text:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - is_read
      - kind
      - task
      - text
    ActivityKindEnum:
      enum:
      - assigned
      - review
      - completed
      - confirmed
      - returned
      - commented
      type: string
      description: |-
        * `assigned` - Gave you a task
        * `review` - Asked you to check a task
        * `completed` - Completed a task you gave
        * `confirmed` - Checked your task
        * `returned` - Sent a task back
        * `commented` - Commented on a task
    AgendaAttendee:
      type: object
      properties:
        member:
          type: object
          additionalProperties: {}
          description: '{id, name, photo_url, position}'
          readOnly: true
        response:
          $ref: '#/components/schemas/AgendaAttendeeResponseEnum'
        responded_at:
          type: string
          format: date-time
          nullable: true
      required:
      - member
    AgendaAttendeeResponseEnum:
      enum:
      - pending
      - going
      - declined
      type: string
      description: |-
        * `pending` - Not answered
        * `going` - Going
