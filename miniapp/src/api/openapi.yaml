      operationId: v1_companies_ai_task_drafts_create
      description: |-
        The task-draft handlers both APIs share; `self.membership` is set by their permission
        classes, `source` names where drafts come from, `visible_drafts()` what the caller sees.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIDraftCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AIDraftCreateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIDraft'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIError'
          description: audio_* or text_too_long
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIError'
          description: ai_off
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIError'
          description: limit_reached
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIDraft'
          description: ''
