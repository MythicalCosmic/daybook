          type: array
          items:
            $ref: '#/components/schemas/WeekdayEnum'
        due_time:
          type: string
          format: time
          description: In the company's timezone.
        assignee_ids:
          type: array
          items:
            type: integer
        position_ids:
          type: array
          items:
            type: integer
        proof:
          $ref: '#/components/schemas/ProofEnum'
        needs_confirmation:
          type: boolean
          nullable: true
          description: 'Empty: the company''s rule for finished work decides (tasks
            settings); true always asks for a check, false never does.'
        is_active:
          type: boolean
      required:
      - due_time
      - title
    TasksReadingPerson:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    TasksReadingSpec:
      type: object
      description: One number a readings task asks for, with its allowed range (PLAN-OWNER
        §14.10).
      properties:
        key:
          type: string
          description: One letter, a to z.
        label:
          type: string
        unit:
          type: string
        min:
          type: string
          nullable: true
          description: 'Decimal string ("2.0"); null: none.'
        max:
          type: string
          nullable: true
          description: 'Decimal string ("8.0"); null: none.'
        critical:
          type: boolean
      required:
      - critical
      - key
      - label
      - max
      - min
      - unit
    TasksReadingTaken:
      type: object
      description: A value typed in for a readings task, with the range it was held
        to.
      properties:
        id:
          type: integer
        key:
          type: string
        label:
          type: string
        unit:
          type: string
        value:
          type: string
          description: Decimal string ("5.2").
        min:
          type: string
          nullable: true
        max:
          type: string
          nullable: true
        in_range:
          type: boolean
        note:
          type: string
        is_recheck:
          type: boolean
        recorded_at:
          type: string
          format: date-time
        recorded_by:
          allOf:
          - $ref: '#/components/schemas/TasksReadingPerson'
          nullable: true
      required:
      - id
      - in_range
      - is_recheck
      - key
      - label
      - max
      - min
      - note
      - recorded_at
      - recorded_by
      - unit
      - value
    TeamMember:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        open:
          type: integer
          description: Shared work still to do.
        late:
          type: integer
          description: Of it, past its deadline.
        done_week:
          type: integer
          description: Finished in the last 7 days.
      required:
      - department
      - done_week
      - id
      - late
      - name
      - open
      - position
    TeamPerson:
      type: object
      properties:
        person:
          $ref: '#/components/schemas/TeamMember'
        open:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        done:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          description: Finished in the last 7 days, newest first.
      required:
      - done
      - open
      - person
    TeamRow:
      type: object
      properties:
        total:
          type: integer
          description: Shared tasks whose deadline passed in the period.
        on_time:
          type: integer
        late:
          type: integer
          description: Finished after the deadline.
        missed:
          type: integer
          description: Still not finished.
        on_time_percent:
          type: integer
          nullable: true
        avg_delay_minutes:
          type: integer
          nullable: true
          description: How late the late ones were, on average.
        late_now:
          type: integer
          description: Open and overdue right now.
        reminders:
          type: integer
          description: Reminders the bot had to send.
        member:
          $ref: '#/components/schemas/MemberBrief'
      required:
      - avg_delay_minutes
      - late
      - late_now
      - member
      - missed
      - on_time
      - on_time_percent
      - reminders
      - total
    TeamStats:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/PeriodEnum'
        start:
          type: string
          format: date
        end:
          type: string
          format: date
          description: The period's last day.
        totals:
          $ref: '#/components/schemas/Score'
        members:
          type: array
          items:
            $ref: '#/components/schemas/TeamRow'
          description: Everyone registered, best first.
      required:
      - end
      - members
      - period
      - start
      - totals
    TelegramAuthRequest:
      type: object
      properties:
        init_data:
          type: string
          minLength: 1
          description: Telegram.WebApp.initData, exactly as received.
      required:
      - init_data
    TimeOff:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_day:
          type: string
          format: date
        last_day:
          type: string
          format: date
        reason:
          type: string
          maxLength: 300
        status:
          allOf:
          - $ref: '#/components/schemas/TimeOffStatusEnum'
          readOnly: true
        days:
          type: integer
          readOnly: true
        decided_by:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - days
      - decided_by
      - first_day
      - id
      - last_day
      - status
    TimeOffRequest:
      type: object
      properties:
        first_day:
          type: string
          format: date
        last_day:
          type: string
          format: date
        reason:
          type: string
          maxLength: 300
      required:
      - first_day
      - last_day
    TimeOffStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - Waiting for approval
        * `approved` - Approved
        * `rejected` - Rejected
        * `cancelled` - Cancelled
    Updated:
      type: object
      properties:
        updated:
          type: integer
      required:
      - updated
    Wallet:
      type: object
      properties:
        currency:
          type: string
        held:
          type: array
          items:
            $ref: '#/components/schemas/HeldAccount'
        held_total:
          type: string
        owed_to_me:
          type: string
        approval_threshold:
          type: string
          nullable: true
        receipt_required_over:
          type: string
          nullable: true
      required:
      - approval_threshold
      - currency
      - held
      - held_total
      - owed_to_me
      - receipt_required_over
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
