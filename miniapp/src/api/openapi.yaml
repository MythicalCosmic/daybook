          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - assigned
          - daily
          - personal
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - board
          - created
          - mine
          - review
          - today
        description: 'today: open tasks due today or late; board: your open tasks
          plus today''s finished; review: waiting for you to check.'
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated statuses.
