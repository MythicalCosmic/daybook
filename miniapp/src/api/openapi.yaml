openapi: 3.0.3
info:
  title: 911 Trello API
  version: 0.1.0
  description: API for the employee mini app and the owner dashboard.
paths:
  /api/v1/auth/telegram/:
    post:
      operationId: v1_auth_telegram_create
      description: |-
        Exchange the mini app's Telegram init data for an access token.

        Only an access token: the mini app signs in again with fresh init data when it expires,
        so no refresh token (and no blacklist row) is made every time the app opens.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/companies/{company_id}/activity/:
    get:
      operationId: v1_companies_activity_list
      description: The signed-in member's feed, newest first.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
  /api/v1/companies/{company_id}/activity/read/:
    post:
      operationId: v1_companies_activity_read_create
      description: Mark the whole feed as read.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marked'
          description: ''
  /api/v1/companies/{company_id}/announcements/:
    get:
      operationId: v1_companies_announcements_list
      description: The announcements I received, newest first with pinned ones on
        top.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pinned
        schema:
          type: boolean
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeedAnnouncementList'
          description: ''
  /api/v1/companies/{company_id}/announcements/{id}/read/:
    post:
      operationId: v1_companies_announcements_read_create
      description: The announcements I received, newest first with pinned ones on
        top.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedAnnouncement'
          description: ''
  /api/v1/companies/{company_id}/attendance/:
    get:
      operationId: v1_companies_attendance_retrieve
      description: 'My month: a coded day each and the totals.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMonth'
          description: ''
  /api/v1/companies/{company_id}/attendance/board/:
    get:
      operationId: v1_companies_attendance_board_retrieve
      description: Who's in now (managers in the app).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/v1/companies/{company_id}/attendance/check-in/:
    post:
      operationId: v1_companies_attendance_check_in_create
      description: Check in with the location of the tap (and a selfie when the company
        asks).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResult'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResult'
          description: ''
  /api/v1/companies/{company_id}/attendance/check-out/:
    post:
      operationId: v1_companies_attendance_check_out_create
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckOutRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResult'
          description: ''
  /api/v1/companies/{company_id}/attendance/corrections/:
    get:
      operationId: v1_companies_attendance_corrections_list
      description: My correction requests, and a new one.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorrectionOut'
          description: ''
    post:
      operationId: v1_companies_attendance_corrections_create
      description: My correction requests, and a new one.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CorrectionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CorrectionRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrectionOut'
          description: ''
  /api/v1/companies/{company_id}/attendance/open-shifts/:
    get:
      operationId: v1_companies_attendance_open_shifts_list
      description: Open shifts I may claim.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenShift'
          description: ''
  /api/v1/companies/{company_id}/attendance/open-shifts/{id}/claim/:
    post:
      operationId: v1_companies_attendance_open_shifts_claim_create
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapOut'
          description: ''
  /api/v1/companies/{company_id}/attendance/records/{id}/:
    get:
      operationId: v1_companies_attendance_records_retrieve
      description: One of my own records (the correction sheet opened from a notification).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordOut'
          description: ''
  /api/v1/companies/{company_id}/attendance/shifts/:
    get:
      operationId: v1_companies_attendance_shifts_list
      description: My published shifts in a period (two weeks from today by default).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShiftOut'
          description: ''
  /api/v1/companies/{company_id}/attendance/swaps/:
    get:
      operationId: v1_companies_attendance_swaps_retrieve
      description: My requests and the ones waiting for my answer; ask for cover or
        a swap.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySwaps'
          description: ''
    post:
      operationId: v1_companies_attendance_swaps_create
      description: My requests and the ones waiting for my answer; ask for cover or
        a swap.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SwapRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SwapRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapOut'
          description: ''
  /api/v1/companies/{company_id}/attendance/swaps/{id}/{verb}/:
    post:
      operationId: v1_companies_attendance_swaps_answer
      description: accept · decline · cancel one request.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: verb
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapOut'
          description: ''
  /api/v1/companies/{company_id}/attendance/swaps/candidates/:
    get:
      operationId: v1_companies_attendance_swaps_candidates_list
      description: Who could cover one of my shifts, with their coming shifts I could
        swap for.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: shift_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
          description: ''
  /api/v1/companies/{company_id}/attendance/today/:
    get:
      operationId: v1_companies_attendance_today_retrieve
      description: 'The check-in card: today''s shift, the open or latest record,
        where to check in.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDay'
          description: ''
  /api/v1/companies/{company_id}/calendar/:
    get:
      operationId: v1_companies_calendar_retrieve
      description: 'My calendar between two days: my events, company events and team
        dates.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaEmployeeCalendar'
          description: ''
  /api/v1/companies/{company_id}/calendar/events/{id}/:
    get:
      operationId: v1_companies_calendar_events_retrieve
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaEvent'
          description: ''
  /api/v1/companies/{company_id}/calendar/events/{id}/respond/:
    post:
      operationId: v1_companies_calendar_events_respond_create
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaRespondRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgendaRespondRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgendaRespondRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaAttendee'
          description: ''
  /api/v1/companies/{company_id}/holidays/:
    get:
      operationId: v1_companies_holidays_list
      description: 'The company''s coming holidays: no daily tasks and no reminders
        on those days.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
          description: ''
  /api/v1/companies/{company_id}/inbox/:
    get:
      operationId: v1_companies_inbox_list
      description: |-
        My notifications in this company, newest first (employee kinds: approvals and alerts
        for owners and managers live in the dashboard).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/companies/{company_id}/inbox/read/:
    post:
      operationId: v1_companies_inbox_read_create
      description: 'Mark some (`ids`) or all (`all: true`) of my notifications read.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Updated'
          description: ''
  /api/v1/companies/{company_id}/knowledge/:
    get:
      operationId: v1_companies_knowledge_retrieve
      description: 'The knowledge base in the app: my spaces, what I still have to
        read, recent pages.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeHome'
          description: ''
  /api/v1/companies/{company_id}/knowledge/linked/:
    get:
      operationId: v1_companies_knowledge_linked_list
      description: |-
        Pages linked to a task or routine ("How to do this"). For a task a routine made, the
        routine's pages come too: linking the routine covers every task it makes (which is why the
        link search leaves those tasks out), and the mini app only knows the task.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: target_id
        schema:
          type: integer
        required: true
      - in: query
        name: target_type
        schema:
          type: string
          enum:
          - routine
          - task
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeLink'
          description: ''
  /api/v1/companies/{company_id}/knowledge/pages/{id}/:
    get:
      operationId: v1_companies_knowledge_pages_retrieve
      description: A page to read, with my acknowledgement.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePageDetail'
          description: ''
  /api/v1/companies/{company_id}/knowledge/pages/{id}/ack/:
    post:
      operationId: v1_companies_knowledge_pages_ack_create
      description: 'I''ve read it: confirms the current version.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEmployeeAck'
          description: ''
  /api/v1/companies/{company_id}/knowledge/search/:
    get:
      operationId: v1_companies_knowledge_search_list
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: query
        name: q
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgePageRow'
          description: ''
  /api/v1/companies/{company_id}/knowledge/spaces/{id}/:
    get:
      operationId: v1_companies_knowledge_spaces_retrieve
      description: One space and its published pages as a tree.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSpaceTree'
          description: ''
  /api/v1/companies/{company_id}/members/:
    get:
      operationId: v1_companies_members_list
      description: |-
        Registered members of the company, e.g. to pick who a task is for: everyone with
        branches.all, otherwise the people sharing one of the caller's branches (§2.6).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberBrief'
          description: ''
  /api/v1/companies/{company_id}/onboarding/:
    post:
      operationId: v1_companies_onboarding_create
      description: |-
        Create the account: name and position. The phone comes from Telegram contact sharing.

        For a pending request this is what sends it to the approvers.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
