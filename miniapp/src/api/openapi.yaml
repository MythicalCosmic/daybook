  /api/v1/companies/{company_id}/tasks/:
    get:
      operationId: v1_companies_tasks_list
      description: Tasks of one company, as the signed-in member may see them.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: given_by
        schema:
          type: string
          enum:
          - me
        description: 'me: tasks I gave to someone else.'
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - assigned
          - daily
          - personal
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Words in the title or description.
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - board
          - created
          - mine
          - review
          - today
        description: 'today: open tasks due today or late; board: your open tasks
          plus today''s finished; review: waiting for you to check.'
      - in: query
        name: status
        schema:
          type: string
        description: Comma-separated statuses.
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: ''
