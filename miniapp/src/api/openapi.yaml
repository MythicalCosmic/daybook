openapi: 3.0.3
info:
  title: 911 Trello API
  version: 0.1.0
  description: API for the employee mini app and the owner dashboard.
paths:
  /api/v1/auth/telegram/:
    post:
      operationId: v1_auth_telegram_create
      description: |-
        Exchange the mini app's Telegram init data for an access token.

        Only an access token: the mini app signs in again with fresh init data when it expires,
        so no refresh token (and no blacklist row) is made every time the app opens.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/companies/{company_id}/activity/:
    get:
      operationId: v1_companies_activity_list
      description: The signed-in member's feed, newest first.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityList'
          description: ''
  /api/v1/companies/{company_id}/activity/read/:
    post:
      operationId: v1_companies_activity_read_create
      description: Mark the whole feed as read.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marked'
          description: ''
  /api/v1/companies/{company_id}/holidays/:
    get:
      operationId: v1_companies_holidays_list
      description: 'The company''s coming holidays: no daily tasks and no reminders
        on those days.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
          description: ''
  /api/v1/companies/{company_id}/inbox/:
    get:
      operationId: v1_companies_inbox_list
      description: |-
        My notifications in this company, newest first (employee kinds: approvals and alerts
        for owners and managers live in the dashboard).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
