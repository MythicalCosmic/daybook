components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
          description: Bearer token for the API. When it expires, sign in with initData
            again.
      required:
      - access
    ActionsEnum:
      enum:
      - start
      - complete
      - confirm
      - return
      - edit
      - cancel
      type: string
      description: |-
        * `start` - start
        * `complete` - complete
        * `confirm` - confirm
        * `return` - return
        * `edit` - edit
        * `cancel` - cancel
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ActivityKindEnum'
          readOnly: true
        task:
          $ref: '#/components/schemas/TaskBrief'
        actor:
          allOf:
          - $ref: '#/components/schemas/MemberBrief'
          nullable: true
        text:
          type: string
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - is_read
      - kind
      - task
      - text
    ActivityKindEnum:
      enum:
      - assigned
      - review
      - completed
      - confirmed
      - returned
      - commented
      type: string
      description: |-
        * `assigned` - Gave you a task
        * `review` - Asked you to check a task
        * `completed` - Completed a task you gave
        * `confirmed` - Checked your task
        * `returned` - Sent a task back
        * `commented` - Commented on a task
    BaseCurrencyEnum:
      enum:
      - UZS
      - USD
      type: string
      description: |-
        * `UZS` - Uzbek som
        * `USD` - US dollar
    BranchBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    CancelRequest:
      type: object
      properties:
        stop_repeating:
          type: boolean
          default: false
    ChecklistItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          readOnly: true
        is_done:
          type: boolean
          readOnly: true
      required:
      - id
      - is_done
      - text
    ChecklistToggleRequest:
      type: object
      properties:
        is_done:
          type: boolean
      required:
      - is_done
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/MemberBrief'
          readOnly: true
          nullable: true
        text:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - id
      - text
    CommentRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
      - text
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeaturesEnum'
          description: Modules switched on.
        owner_sees_personal_tasks:
          type: boolean
          readOnly: true
          description: Owners see the personal tasks employees make for themselves.
        base_currency:
          allOf:
          - $ref: '#/components/schemas/BaseCurrencyEnum'
          readOnly: true
          description: |-
            The currency reports and the ledger add up in. Locked once money is booked.

            * `UZS` - Uzbek som
            * `USD` - US dollar
        team_directory_phones:
          type: boolean
          readOnly: true
          description: Colleagues see each other's phone numbers in the app.
      required:
      - base_currency
      - features
      - id
      - name
      - owner_sees_personal_tasks
      - team_directory_phones
      - timezone
    CompleteRequest:
      type: object
      properties:
        proof_text:
          type: string
          default: ''
        proof_photo:
          type: string
          format: binary
          nullable: true
    ConsoleActionStyleEnum:
      enum:
      - primary
      - danger
      - default
      type: string
      description: |-
        * `primary` - primary
        * `danger` - danger
        * `default` - default
    Day:
      type: object
      properties:
        date:
          type: string
          format: date
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          description: |-
            done: all finished that day; missed: something wasn't; free: nothing was due.

            * `done` - done
            * `missed` - missed
            * `free` - free
            * `today` - today
      required:
      - date
      - state
    FeaturesEnum:
      enum:
      - finance
      - sales
      - stock
      - attendance
      - hr
      - payroll
      - ai
      - recognition
      type: string
      description: |-
        * `finance` - Finance
        * `sales` - Sales and cash
        * `stock` - Stock
        * `attendance` - Attendance
        * `hr` - HR
        * `payroll` - Payroll
        * `ai` - AI assistant
        * `recognition` - Recognition
    Holiday:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - date
      - id
      - name
    InboxPerson:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    InboxSeverityEnum:
      enum:
      - info
      - warning
      - critical
      type: string
      description: |-
        * `info` - Info
        * `warning` - Warning
        * `critical` - Critical
    LanguageEnum:
      enum:
      - uz
      - ru
      - en
      type: string
      description: |-
        * `uz` - O'zbekcha
        * `ru` - Русский
        * `en` - English
    MarkReadRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          maxItems: 500
        all:
          type: boolean
          default: false
    Marked:
      type: object
      properties:
        marked:
          type: integer
      required:
      - marked
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        telegram_id:
          type: integer
          readOnly: true
          nullable: true
        telegram_username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
          description: Only set from a contact the person shared in Telegram.
        language:
          $ref: '#/components/schemas/LanguageEnum'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
          readOnly: true
      required:
      - first_name
      - id
      - last_name
      - memberships
      - phone
      - telegram_id
      - telegram_username
    MemberBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        position:
          type: string
          nullable: true
      required:
      - id
      - name
      - position
    MemberBriefRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: string
          nullable: true
          minLength: 1
      required:
      - name
      - position
    Membership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          $ref: '#/components/schemas/Company'
        status:
          allOf:
          - $ref: '#/components/schemas/MembershipStatusEnum'
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        position:
          allOf:
          - $ref: '#/components/schemas/Position'
          nullable: true
        role:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionsEnum'
          readOnly: true
        is_onboarded:
          type: boolean
        onboarded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejoin_available_at:
          type: string
          format: date-time
          nullable: true
          description: When a rejected person can ask again.
        home_branch:
          allOf:
          - $ref: '#/components/schemas/BranchBrief'
          nullable: true
          description: Where they work.
        branch_ids:
          type: array
          items:
            type: integer
          readOnly: true
        suspended_until:
          type: string
          format: date
          nullable: true
          description: 'While suspended: the last day of it; null: until reinstated.'
      required:
      - branch_ids
      - company
      - decided_at
      - first_name
      - home_branch
      - id
      - is_onboarded
      - last_name
      - onboarded_at
      - permissions
      - position
      - rejoin_available_at
      - role
      - status
      - suspended_until
    MembershipStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - blocked
      - left
      - suspended
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
        * `blocked` - Blocked
        * `left` - Left
        * `suspended` - Suspended
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          type: string
          readOnly: true
          description: Registered kind, e.g. sales.cash_difference.
        severity:
          allOf:
          - $ref: '#/components/schemas/InboxSeverityEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
          description: Dashboard route.
        app_screen:
          type: string
          readOnly: true
          description: Mini app deep link.
        target_type:
          type: string
          readOnly: true
        target_id:
          type: integer
          readOnly: true
          nullable: true
        actor:
          allOf:
          - $ref: '#/components/schemas/InboxPerson'
          nullable: true
          readOnly: true
        actions:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAction'
          readOnly: true
        data:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acted_by:
          type: string
          nullable: true
          readOnly: true
      required:
      - acted_at
      - acted_by
      - actions
      - actor
      - app_screen
      - body
      - created_at
      - data
      - id
      - kind
      - read_at
      - severity
      - target_id
      - target_type
      - title
      - url
    NotificationAction:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        style:
          $ref: '#/components/schemas/ConsoleActionStyleEnum'
        needs_reason:
          type: boolean
      required:
      - key
      - label
      - needs_reason
      - style
    OffToday:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/OffTodayKindEnum'
        name:
          type: string
          description: The holiday's name; empty for time off.
        until:
          type: string
          format: date
          description: The last day off.
      required:
      - kind
      - name
      - until
    OffTodayKindEnum:
      enum:
      - holiday
      - time_off
      type: string
      description: |-
        * `holiday` - holiday
        * `time_off` - time_off
    OnboardingRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        position_id:
          type: integer
          nullable: true
          description: Required when the company has positions.
      required:
      - first_name
      - last_name
    PaginatedActivityList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
    PaginatedCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    PaginatedNotificationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    PaginatedTaskList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    PatchedMeRequest:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/LanguageEnum'
    PatchedReminderPolicyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        heads_up_minutes:
          type: integer
          maximum: 32767
          minimum: 0
          description: A nudge this many minutes before the deadline. 0 = none.
        repeat_every_minutes:
          type: integer
          maximum: 32767
          minimum: 5
          description: After the deadline, remind again this often until it's done.
        max_reminders:
          type: integer
          maximum: 32767
          minimum: 0
