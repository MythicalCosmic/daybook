      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/companies/{company_id}/inbox/read/:
    post:
      operationId: v1_companies_inbox_read_create
      description: 'Mark some (`ids`) or all (`all: true`) of my notifications read.'
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Updated'
          description: ''
  /api/v1/companies/{company_id}/members/:
    get:
      operationId: v1_companies_members_list
      description: |-
        Registered members of the company, e.g. to pick who a task is for: everyone with
        branches.all, otherwise the people sharing one of the caller's branches (§2.6).
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberBrief'
          description: ''
  /api/v1/companies/{company_id}/onboarding/:
    post:
      operationId: v1_companies_onboarding_create
      description: |-
        Create the account: name and position. The phone comes from Telegram contact sharing.

        For a pending request this is what sends it to the approvers.
      parameters:
      - in: path
        name: company_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
  /api/v1/companies/{company_id}/positions/:
