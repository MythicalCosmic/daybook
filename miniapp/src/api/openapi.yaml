openapi: 3.0.3
info:
  title: 911 Trello API
  version: 0.1.0
  description: API for the employee mini app.
paths:
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/telegram/:
    post:
      operationId: v1_auth_telegram_create
      description: Exchange the mini app's Telegram init data for a JWT pair.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/companies/{company_id}/activity/:
    get:
      operationId: v1_companies_activity_list
      description: The signed-in member's feed, newest first.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
